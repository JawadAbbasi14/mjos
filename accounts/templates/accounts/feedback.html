<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    
    <!-- Bootstrap CDN Link (Yeh Bootstrap ko online load karega) -->
    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        body {
            background-color: #f4f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feedback-card {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* Aapka pasandeda custom button color */
        .btn-custom-red {
            background-color: #a30f0f;
            color: white;
            font-weight: 600;
        }
        .btn-custom-red:hover {
            background-color: #820c0c;
            color: white;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="feedback-card">
        <h2 class="text-center mb-4" style="color: #2b2d42; font-weight: 600;">Thanks For Your Opinion</h2>
        
        <form action="" method="POST">
            {% csrf_token %}
            
            <!-- 1. Username Field -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">{{ feedback_form.username.label }}</label>
                {{ feedback_form.username }}
            </div>
            
            <!-- 2. Feedback Message Field -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">{{ feedback_form.user_feedback.label }}</label>
                {{ feedback_form.user_feedback }}                      
                
                <!-- Errors Styling via Bootstrap -->
                {% if feedback_form.user_feedback.errors %}
                    <div class="text-danger small mt-1">
                        {{ feedback_form.user_feedback.errors }}
                    </div>
                {% endif %}
            </div>

            <!-- Submit Button with Custom Red Hover Effect -->
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-custom-red py-2">Submit Feedback</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
