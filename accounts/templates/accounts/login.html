<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f4f5f7;
        color: #222;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.6s ease-in;
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        color: #2b2d42;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>
<h1>Login</h1>
</body>
</html>
